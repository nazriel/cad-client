name: Build

# Release archives for every supported target. Called by CI on every push so
# the default branch keeps a warm cache per runner and pull requests prove the
# cross builds, and by the release workflow with the same steps, so a tagged
# build restores that cache.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  dist:
    name: Dist ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-musl
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
          # Both Apple targets in one job: one macOS runner to wait for, and
          # host build dependencies compiled once.
          - name: macos
            os: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-2025
            targets: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-11-arm
            targets: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: 2026.10.11
          install_args: rust mr-boxington

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          cache-generation: dist-${{ matrix.name }}
          github-cache-mode: objects

      - run: mise run dist ${{ matrix.targets }}
        env:
          # Archives built from anything but a release tag name their commit
          # in `cad-cli --version`; a tag build prints the plain version.
          CAD_CLI_BUILD_COMMIT: ${{ !startsWith(github.ref, 'refs/tags/') && github.sha || '' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # Runs the one-line installers against the archives just built, served
  # from a local HTTP server in place of the GitHub release.
  install:
    name: Install ${{ matrix.os }}
    needs: dist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          pattern: dist-*
          merge-multiple: true

      - name: Install from a local release
        run: |
          version="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          cp install.sh install.ps1 release/
          sha256="$(command -v sha256sum || echo "shasum -a 256")"
          (cd release && $sha256 -- *.tar.gz *.zip > SHA256SUMS)

          python="$(command -v python || command -v python3)"
          "$python" -m http.server 8765 --bind 127.0.0.1 --directory release > /dev/null 2>&1 &
          trap 'kill $!' EXIT
          url=http://127.0.0.1:8765
          for _ in $(seq 30); do curl -fsS -o /dev/null "$url/SHA256SUMS" && break; sleep 1; done

          export CAD_CLI_DOWNLOAD_URL="$url" CAD_CLI_VERSION="$version"
          # A build of the release tag prints the plain version. Any other
          # build (main, pull requests) names the commit the dist job passed
          # in CAD_CLI_BUILD_COMMIT, which is the triggering commit.
          if [[ "$GITHUB_REF" == "refs/tags/$version" ]]; then
            expected="cad-cli ${version#v}"
          else
            expected="cad-cli ${version#v}-dev+${GITHUB_SHA:0:12}"
          fi
          check() { "$1" --version | grep -Fx "$expected"; }
          if [[ "$RUNNER_OS" == Windows ]]; then
            dir="$(cygpath -w "$RUNNER_TEMP")"
            tmp="$(cygpath -u "$RUNNER_TEMP")"
            pwsh -NoProfile -File install.ps1 -BinDir "$dir\\pwsh\\bin"
            check "$tmp/pwsh/bin/cad-cli.exe"
            CAD_CLI_BIN_DIR="$dir\\ps5\\bin" \
              powershell -NoProfile -ExecutionPolicy Bypass -Command "irm $url/install.ps1 | iex"
            check "$tmp/ps5/bin/cad-cli.exe"
          else
            curl -fsSL "$url/install.sh" | CAD_CLI_BIN_DIR="$RUNNER_TEMP/sh/bin" sh
            check "$RUNNER_TEMP/sh/bin/cad-cli"
          fi
