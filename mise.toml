min_version = "2026.9.2"

[settings]
# Every runner the workflows use, windows-arm64 included: CI installs in
# locked mode, so a platform missing here fails the job.
lockfile_platforms = ["linux-x64", "linux-arm64", "linux-x64-musl", "linux-arm64-musl", "macos-arm64", "macos-x64", "windows-x64", "windows-arm64"]

[tools]
rust = { version = "1.99.1", profile = "minimal", components = "clippy,rustfmt", mr_boxington = true }
mr-boxington = "1.25.0"
hk = "2.7.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.31.1"
cargo-deny = "0.20.2"
gh = "2.102.0"
jq = "1.8.2"
