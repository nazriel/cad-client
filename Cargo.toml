[workspace]
members = ["crates/cad-api", "crates/cad-client"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"

[workspace.dependencies]
assert_cmd = "2.2.2"
# The system credential store `cad-cli auth login` keeps API keys in, used by
# `cad-client` only: `keyring-core` plus the store of each platform. On Linux
# the Secret Service is reached through libdbus, vendored so that static musl
# builds need no system library. The pure-Rust zbus store would add 64 crates,
# a slower build, a larger binary and crates flagged unmaintained
# (RUSTSEC-2026-0370, -0371 and -0372).
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }
base64 = "0.23.1"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.48", features = ["derive", "wrap_help"] }
# `unstable-dynamic` provides `CompleteEnv` and `ArgValueCompleter`: shell
# completion that asks the binary for candidates, including IDs from the API.
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
clap_mangen = "0.3.3"
comfy-table = "8.0.0"
console = "0.16.4"
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust", "vendored"] }
flate2 = "1.1.10"
futures-util = "0.3.31"
humantime = "2.4.0"
indicatif = "0.18.6"
keyring-core = "1"
predicates = "3.1.4"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Already in the graph as rustls' crypto provider; the updater borrows its
# SHA-256 rather than compiling a second implementation.
ring = "0.17.14"
schemars = { version = "1.2.1", features = ["chrono04"] }
secrecy = { version = "0.10.3", features = ["serde"] }
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shlex = "2.0.1"
strum = { version = "0.28.0", features = ["derive"] }
tar = { version = "0.4.46", default-features = false }
tempfile = "3.23.0"
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
unicode-width = "0.2.1"
# Feature selection is per crate: a library must not force a runtime flavour or
# signal handling onto its consumers.
tokio = { version = "1.47.1", default-features = false }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
windows-native-keyring-store = "1"
wiremock = "0.6.5"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }

# Release builds (`mise run dist`, `cargo install`) trade build time for a
# smaller executable: no symbol tables (most of the saving), thin LTO in one
# codegen unit, which keeps most of fat LTO's size win at about half its link
# time on every rebuild. `panic = "abort"` also drops the unwinding tables: nothing
# catches a panic (no `catch_unwind`, no spawned task whose panic is joined),
# so a panic is a bug that ends the process either way. Errors and Ctrl-C
# cancellation are ordinary returns and still run destructors, so temporary
# download files are still removed. Test builds always unwind.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# An impl of a trait that declares `async fn` reads best as `async fn`, awaited
# or not; the suggested `impl Future` plus `std::future::ready` only adds noise
# to the test doubles that trip it.
unused_async_trait_impl = "allow"
