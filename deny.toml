# cargo-deny policy. Bans, licenses and sources run with the linters
# (`mise run lint`); advisories run daily in the security workflow
# (`mise run audit`).

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported for the whole graph, not only direct
# dependencies, so a transitive one surfaces in the daily triage.
unmaintained = "all"
yanked = "deny"
ignore = [
  # { id = "RUSTSEC-0000-0000", reason = "why it does not apply, and until when" },
]

[licenses]
confidence-threshold = 0.9
allow = [
  # libdbus, linked statically into the Linux builds (see the clarification).
  "AFL-2.1",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]

# `libdbus-sys` declares only its bindings' license, but its `vendored` feature
# compiles libdbus itself into the binary: AFL-2.1 or GPL-2.0-or-later, of which
# cad-cli takes AFL-2.1. `mise run dist` ships that license as LICENSE-dbus. The
# hashes (XxHash32 of each file, line endings normalised) pin the license files:
# when a new version changes one, cargo-deny drops this clarification without a
# word, and the then unused AFL-2.1 allowance warns `license-not-encountered`.
[[licenses.clarify]]
crate = "libdbus-sys"
expression = "(MIT OR Apache-2.0) AND (AFL-2.1 OR GPL-2.0-or-later)"
license-files = [
  { path = "LICENSE-MIT", hash = 0x48909e0c },
  { path = "LICENSE-APACHE", hash = 0xe1fc3b6e },
  { path = "vendor/dbus/COPYING", hash = 0x9794b080 },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace path dependencies carry no version and are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
