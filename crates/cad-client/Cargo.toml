[package]
name = "cad-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Application library and CLI for Carbon+Alt+Delete"

[lib]
name = "cad_client"
path = "src/lib.rs"

[[bin]]
name = "cad-cli"
path = "src/bin/cad-cli.rs"

[dependencies]
cad-api = { path = "../cad-api" }
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
# Presentation crates live here and only here: cad-api stays on its minimal
# runtime dependency diet.
comfy-table.workspace = true
console.workspace = true
# `cad-cli update` fetches release archives from GitHub, which is not the
# platform, so this crate makes those requests itself. flate2 inflates both
# archive formats.
flate2.workspace = true
humantime.workspace = true
indicatif.workspace = true
keyring-core.workspace = true
reqwest.workspace = true
ring.workspace = true
schemars.workspace = true
secrecy.workspace = true
self-replace.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
uuid.workspace = true

# Release archives are .tar.gz everywhere except Windows, which ships .zip;
# each build links only the reader for its own format.
[target.'cfg(not(windows))'.dependencies]
tar.workspace = true

[target.'cfg(windows)'.dependencies]
zip.workspace = true

# The system keyring behind `auth login`: one store per platform.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
base64.workspace = true
predicates.workspace = true
shlex.workspace = true
wiremock.workspace = true

[lints]
workspace = true
